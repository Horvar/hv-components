<!-- ======= hv-tabs playground ======= -->
<form class="hv-play hv-play--tabs" id="hvTabsPlay">
  <div class="hv-play__header">
    <span class="hv-play__name">hv-tabs</span>
    <button type="button" class="hv-play__toggle" aria-label="Свернуть">−</button>
  </div>

  <div class="hv-play__body">
    <!-- Пресет -->
    <div class="hv-play__section">
      <div class="hv-play__section-title">Пресет</div>
      <div class="hv-play__row--full hv-play__row">
        <label title="Имя пресета; демо использует '__tabsPlay'">
          Имя пресета
          <input type="text" name="presetName" value="__tabsPlay" />
        </label>
      </div>
    </div>

    <!-- Настройки -->
    <div class="hv-play__section">
      <div class="hv-play__section-title">Настройки</div>
      <div class="hv-play__row">
        <label title="click — по клику; hover — при наведении (на тачах → click)">
          Активация
          <select name="trigger">
            <option value="click" selected>click</option>
            <option value="hover">hover</option>
          </select>
        </label>
        <label title="Начальная активная вкладка">
          Начальный
          <select name="initial">
            <option value="first" selected>first</option>
            <option value="last">last</option>
          </select>
        </label>
      </div>
      <div class="hv-play__row">
        <label title="Логи в консоль">
          Отладка
          <select name="debug">
            <option value="false" selected>false</option>
            <option value="true">true</option>
          </select>
        </label>
        <div></div>
      </div>
    </div>
  </div>

  <div class="hv-play__actions">
    <button type="button" class="hv-play__btn-apply" data-action="apply">Применить к демо</button>
    <div class="hv-play__btn-row">
      <button type="button" class="hv-play__btn" data-action="downloadBase" title="Скачать script.js и style.scss">
        Файлы
      </button>
      <button type="button" class="hv-play__btn" data-action="copyPreset" title="Скопировать Tabs.definePreset(...)">
        Пресет
      </button>
      <button type="button" class="hv-play__btn" data-action="copyMarkup" title="Скопировать разметку">Разметка</button>
      <button type="button" class="hv-play__btn" data-action="downloadReadme" title="Скачать README.md">README</button>
    </div>
    <p class="hv-play__hint">Демо использует <code>data-tabs-settings="__tabsPlay"</code>.</p>
  </div>
</form>

<script>
  (function () {
    var p = document.querySelector('#hvTabsPlay');
    var t = p.querySelector('.hv-play__toggle');
    t.addEventListener('click', function () {
      var c = p.classList.toggle('is-collapsed');
      t.textContent = c ? '+' : '−';
    });
  })();
</script>
