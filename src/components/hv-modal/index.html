<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal</title>
  </head>
  <body>
    <header class="hv-header">
      <div
        class="hv-header__content"
        style="display: flex; align-items: center; padding: 0 32px; box-sizing: border-box; gap: 32px"
      ></div>
    </header>

    <main>
      <img src="../../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
      <!-- демо-кнопка + демо-модалка: всегда используют текущий пресет "__play" -->
      <button class="btn" data-modal-button="__demo" style="margin: 16px">Открыть демо-модалку</button>
      <img src="../../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
      <img src="../../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
      <img src="../../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
    </main>

    <div
      class="modal modal--generic"
      data-modal-window="__demo"
      data-modal-settings="__play"
      aria-hidden="true"
      role="dialog"
    >
      <div
        class="modal__panel"
        style="display: flex; flex-direction: column; gap: 8px; padding: 16px; box-sizing: border-box"
      >
        <p style="font-size: 12px; color: #999">
          Закрывается при клике на ссылку. Можно сделать так, чтобы конкретные ссылки не закрывали дропдаун
        </p>
        <button class="btn" style="color: red" data-modal-close>Кнопка закрытия</button>
        <a role="menuitem" href="#" style="color: magenta" data-modal-keep-open onclick="event.preventDefault()"
          >Ссылка без закрытия</a
        >
        <a role="menuitem" href="#" style="color: blue">Ссылка 1</a>
        <a role="menuitem" href="#" style="color: blue">Ссылка 2</a>
        <a role="menuitem" href="#" style="color: blue">Ссылка 3</a>
        <a role="menuitem" href="#" style="color: blue">Ссылка 4</a>
        <a role="menuitem" href="#" style="color: blue">Ссылка 5</a>
        <a role="menuitem" href="#" style="color: blue">Ссылка 6</a>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { Modaler } from './script.js';
      const modal = (window.__hvModalController__ = window.__hvModalController__ || new Modaler());
    </script>
    <script type="module">
      import { hvHeader } from '../hv-header/script.js';
      new hvHeader({
        root: '.hv-header',
        mode: 'fixedAfter',
        threshold: 500,
        scrollBehavior: 'shrink',
        downDelta: 24,
        upDelta: 24,
        fixFx: 'slide',
        fixFxEnterDuration: 220,
        fixFxLeaveDuration: 220,
        fixFxEasing: 'ease',
        overlayAtTop: true,
        debug: false,
      });
    </script>
    <script type="module">
      const html = await fetch('./playground/index.html').then((r) => r.text());
      document.body.insertAdjacentHTML('beforeend', html);
      await import('./playground/script.js');
    </script>
  </body>
</html>
