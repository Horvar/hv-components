<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hv-header playground</title>

    <!-- мини-стили панели -->
    <style>
      .hv-play {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: 340px;
        max-height: 80vh;
        overflow: auto;
        padding: 16px 8px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #ddd;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        border-radius: 12px;
        font:
          14px/1.4 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 0.5em;
      }
      .hv-play::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
      .hv-play__title {
        font-weight: 700;
        margin: 0.25em 0 0.5em;
        text-transform: uppercase;
      }
      .hv-play__subtitle {
        color: #999;
      }
      .hv-play__box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 8px;
        border-radius: 16px;
        background: #f0f0f0;
      }
      .hv-play__row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .hv-play__row--full {
        grid-template-columns: 1fr;
      }
      .hv-play label {
        font-size: 12px;
        color: #333;
      }
      .hv-play input[type='number'],
      .hv-play input[type='text'],
      .hv-play select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }
      .hv-play input[type='checkbox'] {
        transform: translateY(1px);
        margin-right: 6px;
      }
      .hv-play input:disabled,
      .hv-play select:disabled {
        opacity: 0.5;
        background: transparent;
      }
      .hv-play__btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .hv-play button {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #bbb;
        background: #f5f5f5;
        cursor: pointer;
      }
      .hv-play button.is-primary {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      .hv-play small {
        color: #666;
      }
    </style>
  </head>
  <body>
    <!-- демо-хедер -->
    <header class="hv-header">
      <div class="hv-header__content" style="padding: 16px 24px; background: #fff; border-bottom: 2px solid #000">
        <!-- любой контент -->
      </div>
    </header>

    <main>
      <img src="../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
      <img src="../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
      <img src="../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
      <img src="../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
    </main>

    <!-- ======= hv-header playground ======= -->
    <form class="hv-play" id="hvHeaderPlay">
      <div class="hv-play__title">hv-header playground</div>

      <!-- Позиционирование -->
      <div class="hv-play__subtitle">Позиционирование</div>
      <div class="hv-play__box">
        <div class="hv-play__row">
          <label title="static — в потоке; fixed — всегда закреплён; fixedAfter — закрепляется после порога">
            Mode
            <select name="mode">
              <option value="static">static</option>
              <option value="fixed">fixed</option>
              <option value="fixedAfter" selected>fixedAfter</option>
            </select>
          </label>
          <label title="Порог (px) для mode=fixedAfter: после какого скролла включать fixed">
            Threshold (px)
            <input type="number" name="threshold" value="500" step="1" min="0" />
          </label>
        </div>
      </div>

      <!-- Поведение на скролле -->
      <div class="hv-play__subtitle">Поведение на скролле</div>
      <div class="hv-play__box">
        <div class="hv-play__row">
          <label
            title="none — без реакции; shrink — сжимается вниз/раскрывается вверх; reveal — скрывается вниз/показывается вверх"
          >
            Scroll behavior
            <select name="scrollBehavior">
              <option value="none">none</option>
              <option value="shrink">shrink</option>
              <option value="reveal" selected>reveal</option>
            </select>
          </label>
          <div></div>
        </div>
        <div class="hv-play__row">
          <label title="Порог ВВЕРХ: shrink→expand, reveal→show">
            upDelta
            <input type="number" name="upDelta" value="24" step="1" min="0" />
          </label>
          <label title="Порог ВНИЗ: shrink→compact, reveal→hide">
            downDelta
            <input type="number" name="downDelta" value="24" step="1" min="0" />
          </label>
        </div>
      </div>

      <!-- FX -->
      <div class="hv-play__subtitle">Анимации переходов (FX)</div>
      <div class="hv-play__box">
        <div class="hv-play__row">
          <label title="FX static↔fixed (анимируется .hv-header__content)">
            Fix FX
            <select name="fixFx">
              <option value="none">none</option>
              <option value="slide" selected>slide</option>
              <option value="fade">fade</option>
            </select>
          </label>
          <label title="Анимировать первичный вход при mode=fixed">
            <input type="checkbox" name="fixFxOnInit" checked /> fixFxOnInit
          </label>
        </div>
        <div class="hv-play__row">
          <label title="Длительность входа в fixed (мс)">
            FX enter (ms)
            <input type="number" name="fixFxEnterDuration" value="220" step="10" min="0" />
          </label>
          <label title="Длительность выхода из fixed (мс)">
            FX leave (ms)
            <input type="number" name="fixFxLeaveDuration" value="220" step="10" min="0" />
          </label>
        </div>
        <div class="hv-play__row hv-play__row--full">
          <label title="CSS timing-function: ease, linear, cubic-bezier(...)">
            FX easing
            <input type="text" name="fixFxEasing" value="ease" />
          </label>
        </div>
      </div>

      <!-- Дополнительно -->
      <div class="hv-play__subtitle">Дополнительно</div>
      <div class="hv-play__box">
        <div class="hv-play__row hv-play__row--full">
          <label title="Добавляет класс .is-top у самого верха страницы">
            <input type="checkbox" name="overlayAtTop" checked /> overlayAtTop
          </label>
          <label title="Логи в консоль"> <input type="checkbox" name="debug" /> debug </label>
        </div>
      </div>

      <!-- Действия -->
      <div class="hv-play__btns">
        <button type="button" class="is-primary" data-action="apply" title="Обновить демо под текущие настройки">
          Применить к демо
        </button>
        <button type="button" data-action="downloadBase" title="Скачать _hv-header.js и _hv-header.scss">
          Download
        </button>
        <button type="button" data-action="copyInit" title="Скопировать JS-инициализацию с текущими настройками">
          Copy preset
        </button>
        <button type="button" data-action="copyMarkup" title="Скопировать минимальную разметку под хедер">
          Copy markup
        </button>
        <button type="button" data-action="downloadReadme" title="Скачать README.md">README</button>
      </div>

      <small
        >Демо берёт элемент <code>.hv-header</code>. «Применить» обновляет существующий инстанс без пересоздания.</small
      >
    </form>
    <!-- ===================================== -->

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { hvHeader } from '../scripts/_hv-header.js';

      // ---------- helpers ----------
      const $id = (id) => document.getElementById(id);
      const form = $id('hvHeaderPlay');

      const qs = (name) => form.elements[name];
      const num = (el, def = 0) => {
        const n = Number((el?.value ?? '').trim());
        return Number.isFinite(n) ? n : def;
      };
      const blink = (btn, ok = '✓ Done') => {
        const old = btn.textContent;
        btn.textContent = ok;
        btn.disabled = true;
        setTimeout(() => {
          btn.textContent = old;
          btn.disabled = false;
        }, 900);
      };
      const setDisabled = (el, on, why = '') => {
        el.disabled = !!on;
        const label = el.closest('label') || el.parentElement;
        if (!label) return;
        const base = label.getAttribute('data-base-title') ?? label.getAttribute('title') ?? '';
        if (!label.hasAttribute('data-base-title')) label.setAttribute('data-base-title', base);
        label.title = on && why ? `${base} — (не используется: ${why})` : base;
      };
      const serialize = (v) =>
        typeof v === 'string'
          ? `'${v.replace(/'/g, "\\'")}'`
          : typeof v === 'boolean' || Number.isFinite(v)
            ? String(v)
            : 'null';

      // ---------- fields ----------
      const els = {
        mode: qs('mode'),
        threshold: qs('threshold'),
        scrollBehavior: qs('scrollBehavior'),
        downDelta: qs('downDelta'),
        upDelta: qs('upDelta'),
        fixFx: qs('fixFx'),
        fixFxEnterDuration: qs('fixFxEnterDuration'),
        fixFxLeaveDuration: qs('fixFxLeaveDuration'),
        fixFxEasing: qs('fixFxEasing'),
        fixFxOnInit: qs('fixFxOnInit'),
        overlayAtTop: qs('overlayAtTop'),
        debug: qs('debug'),
      };

      // ---------- read form ----------
      const readOptions = () => ({
        root: '.hv-header',
        mode: els.mode.value,
        threshold: num(els.threshold, 0),
        scrollBehavior: els.scrollBehavior.value,
        downDelta: num(els.downDelta, 24),
        upDelta: num(els.upDelta, 24),
        fixFx: els.fixFx.value,
        fixFxEnterDuration: num(els.fixFxEnterDuration, 220),
        fixFxLeaveDuration: num(els.fixFxLeaveDuration, 220),
        fixFxEasing: (els.fixFxEasing.value || 'ease').trim(),
        fixFxOnInit: els.fixFxOnInit.checked,
        overlayAtTop: els.overlayAtTop.checked,
        debug: els.debug.checked,
      });

      // ---------- interlocks ----------
      function enforceInterlocks() {
        const mode = els.mode.value;
        const beh = els.scrollBehavior.value;
        const inStatic = mode === 'static';
        const inFixed = mode === 'fixed';
        const inFA = mode === 'fixedAfter';

        setDisabled(els.threshold, !inFA, inStatic ? 'mode=static' : inFixed ? 'mode=fixed' : '');

        setDisabled(els.scrollBehavior, inStatic, 'mode=static');

        const deltasOff = inStatic || beh === 'none';
        setDisabled(els.downDelta, deltasOff, inStatic ? 'mode=static' : 'behavior=none');
        setDisabled(els.upDelta, deltasOff, inStatic ? 'mode=static' : 'behavior=none');

        const fxNone = els.fixFx.value === 'none';
        setDisabled(els.fixFxOnInit, !inFixed, inStatic ? 'mode=static' : inFA ? 'mode=fixedAfter' : '');

        if (inStatic) {
          setDisabled(els.fixFx, true, 'mode=static');
          setDisabled(els.fixFxEnterDuration, true, 'mode=static');
          setDisabled(els.fixFxLeaveDuration, true, 'mode=static');
          setDisabled(els.fixFxEasing, true, 'mode=static');
        } else if (inFixed) {
          const off = !els.fixFxOnInit.checked;
          setDisabled(els.fixFx, off, 'fixFxOnInit=false');
          setDisabled(els.fixFxEnterDuration, off || fxNone, off ? 'fixFxOnInit=false' : fxNone ? 'fixFx=none' : '');
          setDisabled(els.fixFxLeaveDuration, off || fxNone, off ? 'fixFxOnInit=false' : fxNone ? 'fixFx=none' : '');
          setDisabled(els.fixFxEasing, off || fxNone, off ? 'fixFxOnInit=false' : fxNone ? 'fixFx=none' : '');
        } else {
          // fixedAfter: входной FX не нужен при reveal (вход скрытый)
          const enterOff = beh === 'reveal';
          setDisabled(els.fixFx, false, '');
          setDisabled(
            els.fixFxEnterDuration,
            enterOff || fxNone,
            enterOff ? 'reveal: вход скрытый' : fxNone ? 'fixFx=none' : ''
          );
          setDisabled(els.fixFxLeaveDuration, fxNone, fxNone ? 'fixFx=none' : '');
          setDisabled(els.fixFxEasing, fxNone, fxNone ? 'fixFx=none' : '');
        }

        setDisabled(els.overlayAtTop, inStatic, 'mode=static');
      }

      // ---------- header demo singleton ----------
      let header = window.__hvHeaderDemo__;
      if (!header) {
        header = new hvHeader({ root: '.hv-header', mode: 'fixedAfter', threshold: 500, scrollBehavior: 'reveal' });
        window.__hvHeaderDemo__ = header;
      }

      // ---------- actions ----------
      function applyToDemo() {
        const o = readOptions();

        // мягкое обновление без пересоздания
        header.setMode(o.mode);
        header.setThreshold(o.threshold);

        header.o.scrollBehavior = o.scrollBehavior;
        header.o.downDelta = o.downDelta;
        header.o.upDelta = o.upDelta;

        header.o.fixFx = o.fixFx;
        header.o.fixFxEnterDuration = o.fixFxEnterDuration;
        header.o.fixFxLeaveDuration = o.fixFxLeaveDuration;
        header.o.fixFxEasing = o.fixFxEasing;
        header.o.fixFxOnInit = o.fixFxOnInit;
        header._initFxCssHooks();

        header.o.overlayAtTop = o.overlayAtTop;
        header.o.debug = o.debug;

        header._recalcAll();
        header._updateState(true);

        enforceInterlocks();
        blink(form.querySelector('[data-action="apply"]'), '✓ Применено');
      }

      function downloadBase() {
        const files = [
          ['/components/hv-header/_hv-header.js', '_hv-header.js'],
          ['/components/hv-header/_hv-header.scss', '_hv-header.scss'],
        ];
        for (const [url, name] of files) {
          const a = document.createElement('a');
          a.href = url;
          a.download = name;
          a.rel = 'noopener';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          a.remove();
        }
        blink(form.querySelector('[data-action="downloadBase"]'), '✓ Downloaded');
      }

      async function copyInit() {
        const o = readOptions();
        const obj = {
          root: '.hv-header',
          mode: o.mode,
          ...(o.mode === 'fixedAfter' ? { threshold: o.threshold } : {}),
          scrollBehavior: o.scrollBehavior,
          ...(o.scrollBehavior !== 'none' ? { downDelta: o.downDelta, upDelta: o.upDelta } : {}),
          fixFx: o.fixFx,
          fixFxEnterDuration: o.fixFxEnterDuration,
          fixFxLeaveDuration: o.fixFxLeaveDuration,
          fixFxEasing: o.fixFxEasing,
          ...(o.mode === 'fixed' ? { fixFxOnInit: o.fixFxOnInit } : {}),
          overlayAtTop: o.overlayAtTop,
          debug: o.debug,
        };
        const lines = Object.entries(obj)
          .map(([k, v]) => `  ${k}: ${serialize(v)},`)
          .join('\n');
        const code = `import { hvHeader } from '../scripts/_hv-header.js';

new hvHeader({
${lines}
});`;
        try {
          await navigator.clipboard.writeText(code);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = code;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        blink(form.querySelector('[data-action="copyInit"]'), '✓ Copied');
      }

      async function copyMarkup() {
        const tpl = `<header class="hv-header">
  <div class="hv-header__content">
    <!-- content -->
  </div>
</header>`;
        try {
          await navigator.clipboard.writeText(tpl);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = tpl;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        blink(form.querySelector('[data-action="copyMarkup"]'), '✓ Copied');
      }

      async function downloadReadme() {
        const candidates = [
          './hv-header-README.md',
          '../hv-header-README.md',
          '../docs/hv-header-README.md',
          '/components/hv-header/hv-header-README.md',
        ];
        let text = '# hv-header\n\nREADME не найден рядом с демо.';
        for (const url of candidates) {
          try {
            const res = await fetch(url, { cache: 'no-store' });
            if (res.ok) {
              text = await res.text();
              break;
            }
          } catch {}
        }
        const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'hv-header-README.md';
        document.body.appendChild(a);
        a.click();
        URL.revokeObjectURL(a.href);
        a.remove();
        blink(form.querySelector('[data-action="downloadReadme"]'), '✓ Saved');
      }

      // ---------- wire ----------
      form.addEventListener('change', (e) => {
        applyToDemo();
        if (['mode', 'scrollBehavior', 'fixFx', 'fixFxOnInit'].includes(e.target.name)) enforceInterlocks();
      });
      form.addEventListener('input', (e) => {
        if (
          ['threshold', 'downDelta', 'upDelta', 'fixFxEnterDuration', 'fixFxLeaveDuration', 'fixFxEasing'].includes(
            e.target.name
          )
        ) {
          applyToDemo();
        }
        if (['mode', 'scrollBehavior', 'fixFx', 'fixFxOnInit'].includes(e.target.name)) enforceInterlocks();
      });

      form.querySelector('[data-action="apply"]').addEventListener('click', applyToDemo);
      form.querySelector('[data-action="downloadBase"]').addEventListener('click', downloadBase);
      form.querySelector('[data-action="copyInit"]').addEventListener('click', copyInit);
      form.querySelector('[data-action="copyMarkup"]').addEventListener('click', copyMarkup);
      form.querySelector('[data-action="downloadReadme"]').addEventListener('click', downloadReadme);

      // старт
      enforceInterlocks();
      // первичное применение (с текущими значениями формы)
      applyToDemo();
    </script>
  </body>
</html>
