<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hv-header Fixed-after Reveal</title>
  </head>
  <body>
    <div class="hv-header">
      <div class="hv-header__rail">
        <div class="hv-header__wrapper">
          <div class="hv-header__square"></div>
          <div class="hv-header__square"></div>
          <div class="hv-header__square"></div>
        </div>
      </div>
    </div>

    <main>
      <img src="../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
      <img src="../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
      <img src="../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
      <img src="../assets/images/bg-1.jpg" alt="" class="pseudo-content" />
    </main>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { hvHeader } from '../scripts/_hv-header.js';

      new hvHeader({
        root: '.hv-header',
        mode: 'fixedAfter',
        threshold: 500,
        scrollBehavior: 'reveal',
        compensate: 'spacer',
        fixFx: 'slide',
      });
    </script>
  </body>
</html>
